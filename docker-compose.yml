# TourDesk – Docker Compose (für den Betrieb in einem Proxmox-LXC oder jedem Linux-Host)
#
#   cp .env.example .env   # oder ./install.sh erledigt das automatisch
#   docker compose up -d --build
#
# Cloudflare Tunnel (optional): TUNNEL_TOKEN in .env setzen und
#   docker compose --profile tunnel up -d

name: tourdesk

x-tourdesk: &tourdesk
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: tourdesk:latest
  restart: unless-stopped
  env_file: .env
  environment:
    TOURDESK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tourdesk}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/${POSTGRES_DB:-tourdesk}
    TOURDESK_DATA_DIR: /data
    TOURDESK_HOST: 0.0.0.0
    TOURDESK_PORT: "8080"
    TOURDESK_TRUSTED_PROXIES: ${TOURDESK_TRUSTED_PROXIES:-127.0.0.1,::1,172.28.0.0/24}
  volumes:
    - tourdesk-data:/data
  depends_on:
    db:
      condition: service_healthy
  networks:
    - tourdesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tourdesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tourdesk

  app:
    <<: *tourdesk
    command: ["api"]
    ports:
      - "${TOURDESK_BIND:-0.0.0.0}:${TOURDESK_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 90s
      retries: 3

  worker:
    <<: *tourdesk
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *tourdesk
    command: ["scheduler"]
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tourdesk

volumes:
  postgres-data:
  tourdesk-data:

networks:
  tourdesk:
    ipam:
      config:
        - subnet: 172.28.0.0/24
