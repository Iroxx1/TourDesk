[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tourdesk"
version = "1.0.0"
description = "TourDesk – persönliche Konzert- und Tourüberwachung (Backend/API)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.2",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "httpx>=0.27,<1",
    "rapidfuzz>=3.9,<4",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
tourdesk = "tourdesk.cli:main"

[tool.setuptools.packages.find]
include = ["tourdesk*"]
