# Alembic configuration for developers.
# In production migrations are applied with `tourdesk migrate` (or automatically on start).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = backend
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# database URL is taken from TOURDESK_DATABASE_URL (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
